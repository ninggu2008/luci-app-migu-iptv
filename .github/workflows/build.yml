name: Build Migu IPTV IPK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Inspect repository
        shell: bash
        run: |
          set -eu

          echo "===== Repository root ====="
          pwd

          echo "===== Top-level files ====="
          ls -la

          echo "===== Locate files directories ====="
          find . -type d -name files -not -path './.git/*' -print

          echo "===== Source file listing ====="
          find . -type f -not -path './.git/*' | sort | head -200

      - name: Build architecture-independent IPK
        shell: bash
        run: |
          set -Eeuo pipefail

          PKG="luci-app-migu-iptv"
          VERSION="1.2.0"
          RELEASE="1"
          WORK="$RUNNER_TEMP/ipk"
          OUT="$GITHUB_WORKSPACE/dist"
          IPK="$OUT/${PKG}_${VERSION}-${RELEASE}_all.ipk"

          echo "===== Locate package files ====="

          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            SRC="$GITHUB_WORKSPACE/files"
          elif [ -d "$GITHUB_WORKSPACE/luci-app-migu-iptv/files" ]; then
            SRC="$GITHUB_WORKSPACE/luci-app-migu-iptv/files"
          else
            echo "::error::Cannot find the project's files/ directory."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
              -not -path '*/.git/*' | sort | head -300
            exit 1
          fi

          echo "Using source directory: $SRC"

          echo "===== Check required files ====="

          REQUIRED_FILES=(
            "etc/config/migu"
            "etc/init.d/migu"
            "usr/share/luci/menu.d/luci-app-migu-iptv.json"
            "usr/share/rpcd/acl.d/luci-app-migu-iptv.json"
            "usr/share/rpcd/ucode/migu"
            "usr/share/ucode/migu.uc"
            "www/luci-static/resources/view/migu/config.js"
            "www/luci-static/resources/view/migu/status.js"
          )

          MISSING=0

          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$SRC/$f" ]; then
              echo "[OK]      $f"
            else
              echo "::error::Missing required file: $SRC/$f"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "===== Actual source files ====="
            find "$SRC" -type f | sort
            exit 1
          fi

          echo "===== Prepare package ====="

          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/control" "$WORK/data" "$OUT"

          # Copy the complete files/ tree.
          # This preserves the exact OpenWrt installation paths.
          cp -a "$SRC/." "$WORK/data/"

          # Init script must be executable.
          chmod 0755 "$WORK/data/etc/init.d/migu"

          echo "===== Create package metadata ====="

          cat > "$WORK/control/control" <<EOF
          Package: ${PKG}
          Version: ${VERSION}-${RELEASE}
          Architecture: all
          Maintainer: Migu IPTV Relay
          Section: net
          Priority: optional
          License: Apache-2.0
          Depends: ucode, ucode-mod-fs, ucode-mod-uloop, ucode-mod-socket, ucode-mod-uci, curl, openssl-util, rpcd, luci-base
          Description: Migu IPTV Relay LuCI application
          EOF

          # Remove indentation introduced by the YAML heredoc.
          sed -i 's/^[[:space:]]*//' "$WORK/control/control"

          # Preserve UCI configuration.
          printf '%s\n' '/etc/config/migu' \
            > "$WORK/control/conffiles"

          # IPK format version.
          printf '2.0\n' > "$WORK/debian-binary"

          echo "===== Create control.tar.gz ====="

          tar --format=gnu \
            --numeric-owner \
            --owner=0 \
            --group=0 \
            -czf "$WORK/control.tar.gz" \
            -C "$WORK/control" \
            control conffiles

          echo "===== Create data.tar.gz ====="

          tar --format=gnu \
            --numeric-owner \
            --owner=0 \
            --group=0 \
            -czf "$WORK/data.tar.gz" \
            -C "$WORK/data" .

          echo "===== Validate gzip archives ====="

          gzip -t "$WORK/control.tar.gz"
          gzip -t "$WORK/data.tar.gz"

          echo "===== Create IPK archive ====="

          (
            cd "$WORK"

            ar -crD "$IPK" \
              debian-binary \
              control.tar.gz \
              data.tar.gz
          )

          echo "===== Validate IPK archive ====="

          ar t "$IPK" | tee "$WORK/ar-members.txt"

          grep -Fxq "debian-binary" "$WORK/ar-members.txt"
          grep -Fxq "control.tar.gz" "$WORK/ar-members.txt"
          grep -Fxq "data.tar.gz" "$WORK/ar-members.txt"

          echo "===== Validate IPK version ====="

          ar p "$IPK" debian-binary > "$WORK/version-check"

          test "$(tr -d '\r\n' < "$WORK/version-check")" = "2.0"

          echo "===== Extract IPK for verification ====="

          mkdir -p \
            "$WORK/verify-control" \
            "$WORK/verify-data"

          ar p "$IPK" control.tar.gz \
            > "$WORK/verify-control.tar.gz"

          ar p "$IPK" data.tar.gz \
            > "$WORK/verify-data.tar.gz"

          tar -xzf "$WORK/verify-control.tar.gz" \
            -C "$WORK/verify-control"

          tar -xzf "$WORK/verify-data.tar.gz" \
            -C "$WORK/verify-data"

          echo "===== Validate control metadata ====="

          CONTROL="$WORK/verify-control/control"

          test -s "$CONTROL"

          grep -Fxq "Package: ${PKG}" "$CONTROL"
          grep -Fxq "Version: ${VERSION}-${RELEASE}" "$CONTROL"
          grep -Fxq "Architecture: all" "$CONTROL"

          grep -Fxq "/etc/config/migu" \
            "$WORK/verify-control/conffiles"

          echo "===== Validate package files ====="

          test -f "$WORK/verify-data/etc/config/migu"
          test -f "$WORK/verify-data/etc/init.d/migu"

          test -f \
            "$WORK/verify-data/usr/share/luci/menu.d/luci-app-migu-iptv.json"

          test -f \
            "$WORK/verify-data/usr/share/rpcd/acl.d/luci-app-migu-iptv.json"

          test -f \
            "$WORK/verify-data/usr/share/rpcd/ucode/migu"

          test -f \
            "$WORK/verify-data/usr/share/ucode/migu.uc"

          test -f \
            "$WORK/verify-data/www/luci-static/resources/view/migu/config.js"

          test -f \
            "$WORK/verify-data/www/luci-static/resources/view/migu/status.js"

          echo "===== Check permissions ====="

          INIT_MODE=$(stat -c '%a' \
            "$WORK/verify-data/etc/init.d/migu")

          echo "init.d/migu permissions: $INIT_MODE"

          test "$INIT_MODE" = "755"

          echo "===== Package information ====="

          file "$IPK"

          ls -lh "$IPK"

          echo "===== IPK archive members ====="

          cat "$WORK/ar-members.txt"

          echo "===== Control metadata ====="

          cat "$CONTROL"

          echo "===== Data files ====="

          find "$WORK/verify-data" -type f | sort

          echo "======================================"
          echo "IPK BUILD SUCCESSFUL"
          echo "======================================"
          echo "Output:"
          echo "$IPK"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-migu-iptv-all-ipk
          path: dist/luci-app-migu-iptv_1.2.0-1_all.ipk
          if-no-files-found: error
          retention-days: 30
