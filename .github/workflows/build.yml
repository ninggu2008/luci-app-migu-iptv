name: Build Migu IPTV IPK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build architecture-independent IPK
        shell: bash
        run: |
          set -Eeuo pipefail

          PKG="luci-app-migu-iptv"
          VERSION="1.2.0"
          RELEASE="1"

          WORK="$RUNNER_TEMP/ipk"
          OUT="$GITHUB_WORKSPACE/dist"
          IPK="$OUT/${PKG}_${VERSION}-${RELEASE}_all.ipk"

          echo "======================================"
          echo "Building $PKG"
          echo "Version: $VERSION-$RELEASE"
          echo "Architecture: all"
          echo "======================================"

          # ------------------------------------------------------------
          # Locate source files
          # ------------------------------------------------------------

          if [ -d "$GITHUB_WORKSPACE/files" ]; then
            SRC="$GITHUB_WORKSPACE/files"
          elif [ -d "$GITHUB_WORKSPACE/luci-app-migu-iptv/files" ]; then
            SRC="$GITHUB_WORKSPACE/luci-app-migu-iptv/files"
          else
            echo "::error::Cannot find files/ directory."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
              -not -path '*/.git/*' | sort
            exit 1
          fi

          echo "Source directory:"
          echo "$SRC"

          # ------------------------------------------------------------
          # Check required files
          # ------------------------------------------------------------

          REQUIRED_FILES=(
            "etc/config/migu"
            "etc/init.d/migu"
            "usr/share/luci/menu.d/luci-app-migu-iptv.json"
            "usr/share/rpcd/acl.d/luci-app-migu-iptv.json"
            "usr/share/rpcd/ucode/migu"
            "usr/share/ucode/migu.uc"
            "www/luci-static/resources/view/migu/config.js"
            "www/luci-static/resources/view/migu/status.js"
          )

          MISSING=0

          echo ""
          echo "===== Check required files ====="

          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$SRC/$f" ]; then
              echo "[OK] $f"
            else
              echo "::error::Missing file: $SRC/$f"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "===== Actual source files ====="
            find "$SRC" -type f | sort
            exit 1
          fi

          # ------------------------------------------------------------
          # Prepare package directory
          # ------------------------------------------------------------

          rm -rf "$WORK" "$OUT"

          mkdir -p \
            "$WORK/control" \
            "$WORK/data" \
            "$OUT"

          # Copy all package payload files.
          cp -a "$SRC/." "$WORK/data/"

          # OpenWrt init scripts must be executable.
          chmod 0755 "$WORK/data/etc/init.d/migu"

          # ------------------------------------------------------------
          # Create control metadata
          # ------------------------------------------------------------

          cat > "$WORK/control/control" <<EOF
          Package: ${PKG}
          Version: ${VERSION}-${RELEASE}
          Architecture: all
          Maintainer: Migu IPTV Relay
          Section: net
          Priority: optional
          License: Apache-2.0
          Depends: ucode, ucode-mod-fs, ucode-mod-uloop, ucode-mod-socket, ucode-mod-uci, curl, openssl-util, rpcd, luci-base
          Description: Migu IPTV Relay LuCI application
          EOF

          # Remove indentation introduced by YAML.
          sed -i 's/^[[:space:]]*//' "$WORK/control/control"

          # Preserve UCI configuration during package upgrades/removal.
          printf '%s\n' \
            '/etc/config/migu' \
            > "$WORK/control/conffiles"

          # ------------------------------------------------------------
          # Calculate installed size
          # ------------------------------------------------------------

          INSTALLED_SIZE=$(du -sk "$WORK/data" | awk '{print $1}')

          echo "Installed size: ${INSTALLED_SIZE} KB"

          printf '%s\n' \
            "Installed-Size: ${INSTALLED_SIZE}" \
            >> "$WORK/control/control"

          # ------------------------------------------------------------
          # Create control.tar.gz
          # ------------------------------------------------------------

          echo ""
          echo "===== Create control.tar.gz ====="

          (
            cd "$WORK/control"

            tar \
              --format=gnu \
              --numeric-owner \
              --owner=0 \
              --group=0 \
              --sort=name \
              -czf "$WORK/control.tar.gz" \
              .
          )

          # ------------------------------------------------------------
          # Create data.tar.gz
          # ------------------------------------------------------------

          echo "===== Create data.tar.gz ====="

          (
            cd "$WORK/data"

            tar \
              --format=gnu \
              --numeric-owner \
              --owner=0 \
              --group=0 \
              --sort=name \
              -czf "$WORK/data.tar.gz" \
              .
          )

          # Validate gzip archives.
          gzip -t "$WORK/control.tar.gz"
          gzip -t "$WORK/data.tar.gz"

          # ------------------------------------------------------------
          # Create debian-binary
          # ------------------------------------------------------------

          printf '2.0\n' > "$WORK/debian-binary"

          # ------------------------------------------------------------
          # Create OpenWrt IPK
          #
          # IMPORTANT:
          # OpenWrt IPK is NOT an ar archive.
          #
          # It is:
          #
          # gzip(
          #   tar(
          #     ./debian-binary
          #     ./data.tar.gz
          #     ./control.tar.gz
          #   )
          # )
          # ------------------------------------------------------------

          echo "===== Create IPK ====="

          (
            cd "$WORK"

            tar \
              --format=gnu \
              --numeric-owner \
              --owner=0 \
              --group=0 \
              --sort=name \
              -czf "$IPK" \
              ./debian-binary \
              ./data.tar.gz \
              ./control.tar.gz
          )

          # ------------------------------------------------------------
          # Validate outer IPK
          # ------------------------------------------------------------

          echo ""
          echo "===== Validate IPK ====="

          test -s "$IPK"

          echo "File type:"
          file "$IPK"

          echo ""
          echo "IPK size:"
          ls -lh "$IPK"

          echo ""
          echo "Outer archive contents:"

          tar -tzf "$IPK"

          # Verify required members.
          tar -tzf "$IPK" | grep -Fxq "./debian-binary"
          tar -tzf "$IPK" | grep -Fxq "./data.tar.gz"
          tar -tzf "$IPK" | grep -Fxq "./control.tar.gz"

          # ------------------------------------------------------------
          # Extract outer IPK and validate its components
          # ------------------------------------------------------------

          VERIFY="$WORK/verify"
          rm -rf "$VERIFY"
          mkdir -p "$VERIFY"

          tar -xzf "$IPK" -C "$VERIFY"

          # Verify debian-binary.
          test "$(tr -d '\r\n' < "$VERIFY/debian-binary")" = "2.0"

          # Verify inner gzip files.
          gzip -t "$VERIFY/control.tar.gz"
          gzip -t "$VERIFY/data.tar.gz"

          # ------------------------------------------------------------
          # Validate control archive
          # ------------------------------------------------------------

          mkdir -p "$VERIFY/control"

          tar \
            -xzf "$VERIFY/control.tar.gz" \
            -C "$VERIFY/control"

          echo ""
          echo "===== Control metadata ====="

          cat "$VERIFY/control/control"

          echo ""

          grep -Fxq "Package: ${PKG}" \
            "$VERIFY/control/control"

          grep -Fxq "Version: ${VERSION}-${RELEASE}" \
            "$VERIFY/control/control"

          grep -Fxq "Architecture: all" \
            "$VERIFY/control/control"

          grep -Fxq "/etc/config/migu" \
            "$VERIFY/control/conffiles"

          # ------------------------------------------------------------
          # Validate data archive
          # ------------------------------------------------------------

          mkdir -p "$VERIFY/data"

          tar \
            -xzf "$VERIFY/data.tar.gz" \
            -C "$VERIFY/data"

          echo ""
          echo "===== Validate installed files ====="

          for f in "${REQUIRED_FILES[@]}"; do
            if [ -f "$VERIFY/data/$f" ]; then
              echo "[OK] $f"
            else
              echo "::error::Missing packaged file: $f"
              exit 1
            fi
          done

          # Verify init script permission.
          INIT_MODE=$(stat -c '%a' \
            "$VERIFY/data/etc/init.d/migu")

          echo ""
          echo "init.d/migu mode: $INIT_MODE"

          test "$INIT_MODE" = "755"

          # ------------------------------------------------------------
          # Final information
          # ------------------------------------------------------------

          echo ""
          echo "======================================"
          echo "IPK BUILD SUCCESSFUL"
          echo "======================================"

          echo ""
          echo "Output file:"
          echo "$IPK"

          echo ""
          echo "File information:"
          file "$IPK"

          echo ""
          echo "Archive contents:"
          tar -tzf "$IPK"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-migu-iptv-all-ipk
          path: dist/luci-app-migu-iptv_1.2.0-1_all.ipk
          if-no-files-found: error
          retention-days: 30
