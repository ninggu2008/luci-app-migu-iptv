# 生成控制信息归档
tar --format=gnu --numeric-owner --owner=0 --group=0 \
  -czf "$WORK/control.tar.gz" \
  -C "$WORK/control" control conffiles

# 生成程序文件归档
tar --format=gnu --numeric-owner --owner=0 --group=0 \
  -czf "$WORK/data.tar.gz" \
  -C "$WORK/data" .

# 写入 IPK 格式版本
printf '2.0\n' > "$WORK/debian-binary"

# 创建 IPK，固定归档成员顺序
(
  cd "$WORK"
  rm -f "$OUT/${PKG}_${VERSION}-${RELEASE}_all.ipk"
  ar -crD "$OUT/${PKG}_${VERSION}-${RELEASE}_all.ipk" \
    debian-binary control.tar.gz data.tar.gz
)

# 验证
gzip -t "$WORK/control.tar.gz"
gzip -t "$WORK/data.tar.gz"
ar t "$OUT/${PKG}_${VERSION}-${RELEASE}_all.ipk"
